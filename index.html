<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Panic Shot (build de teste)</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #231F20; outline: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #eee; font: 600 16px system-ui, -apple-system, sans-serif; background: #151317; }
  #bar { width: min(320px, 70vw); height: 10px; border-radius: 5px; background: #333; overflow: hidden; }
  #fill { height: 100%; width: 0%; background: #ffb340; transition: width .15s; }
  #sub { font-weight: 400; font-size: 13px; color: #999; text-align: center; padding: 0 24px; }
  #msg { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); max-width: 90vw; display: none; z-index: 5; font: 14px system-ui, -apple-system, sans-serif; }
  #msg div { padding: 10px 14px; border-radius: 8px; margin-bottom: 6px; background: #fff3b0; color: #222; }
  #msg div.error { background: #ff6b6b; color: #fff; }
  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; background: rgba(10,10,12,.92); color: #eee; font: 600 18px system-ui, -apple-system, sans-serif; z-index: 4; }
  @media (orientation: portrait) and (max-width: 820px) { body.started #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading">
  <div>PANIC SHOT</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="sub">Carregando… (cerca de 16 MB na primeira vez)</div>
</div>
<div id="rotate">Gire o aparelho para a horizontal ↻</div>
<div id="msg"></div>
<script>
  var canvas = document.getElementById("unity-canvas");
  function showBanner(text, type) {
    var box = document.getElementById("msg");
    var d = document.createElement("div");
    d.textContent = text;
    if (type == "error") d.className = "error";
    box.appendChild(d); box.style.display = "block";
    if (type != "error") setTimeout(function () { box.removeChild(d); if (!box.children.length) box.style.display = "none"; }, 5000);
  }
  var config = {
    arguments: [],
    dataUrl: "",
    frameworkUrl: "Web.framework.js.unityweb?v=0.3.1",
    codeUrl: "",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "3Dungeon",
    productName: "Panic Shot",
    productVersion: "0.3.1",
    showBanner: showBanner,
    // Retina screens at 3x are heavy for a prototype: cap at 2x.
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
  };
  // GitHub web uploads are limited in size, so the two big files are stored in parts and joined here.
  var parts = { code: 3, data: 2 };
  var total = 0, got = 0;
  function joinParts(name, count) {
    var list = [];
    for (var i = 0; i < count; i++) list.push(name + ".part" + i + "?v=0.3.1");
    return Promise.all(list.map(function (u) {
      return fetch(u, { cache: "no-cache" }).then(function (r) {
        if (!r.ok) throw new Error("falha ao baixar " + u + " (" + r.status + ")");
        return r.arrayBuffer();
      }).then(function (b) { got += b.byteLength; document.getElementById("fill").style.width = Math.round(Math.min(got / 15600000, 1) * 70) + "%"; return b; });
    })).then(function (bufs) { return URL.createObjectURL(new Blob(bufs, { type: "application/octet-stream" })); });
  }
  var s = document.createElement("script");
  s.src = "Web.loader.js?v=0.3.1";
  s.onload = function () {
    Promise.all([joinParts("code", parts.code), joinParts("data", parts.data)]).then(function (urls) {
      config.codeUrl = urls[0]; config.dataUrl = urls[1];
      return createUnityInstance(canvas, config, function (p) {
        document.getElementById("fill").style.width = Math.round(70 + p * 30) + "%";
      });
    }).then(function () {
      document.getElementById("loading").style.display = "none";
      document.body.classList.add("started");
      canvas.focus();
    }).catch(function (e) {
      document.getElementById("sub").textContent = "Não foi possível abrir o jogo: " + e;
      showBanner("Erro ao carregar: " + e, "error");
    });
  };
  s.onerror = function () { document.getElementById("sub").textContent = "Falha ao baixar o carregador do jogo."; };
  document.body.appendChild(s);
  document.addEventListener("pointerdown", function () { canvas.focus(); });
</script>
</body>
</html>
